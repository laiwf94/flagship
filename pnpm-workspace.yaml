packages:
  - packages/*
  - apps/*
  - examples/*

# Refuse any package version, direct or transitive, published less than 14 days ago.
minimumReleaseAge: 20160
# Security fixes published inside that window, taken on purpose. Each is
# listed with its advisory in docs/DESIGN.md#dependencies.
minimumReleaseAgeExclude:
  - fastify
  - fast-uri
  - '@isaacs/nonrecursive-glob-match'
  - glob
  - path-scurry
  - minimatch
  - undici
  - zod

overrides:
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.3
  glob@>=9.0.0 <14.0.2: 14.0.3
  minimatch@>=7.0.0 <11.0.1: 11.0.4
  undici@>=8.0.0 <8.12.2: 8.12.2
